# Standalone companion wheel for the stannum extension (packaging phase 2).
# The base pgembed wheel bundles this package through the root pyproject's
# `pgembed*` include glob and takes stannum's native artifacts from the
# shared bundled PostgreSQL prefix; this manifest is used by
# tools/build_standalone_extension_wheel.py, which stages the extension
# library at the package root and the control + SQL files under the
# package-local pginstall tree before building.
[project]
name = "pgembed-stannum"
version = "0.3.0rc2"
description = "stannum BM25 full-text search extension for pgembed"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pgembed>=0.3.0rc2,<0.4",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llama-index = ["llama-index-core>=0.11"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgembed_stannum = [
    "*.dylib",
    "*.so",
    "*.dll",
    "pginstall/share/postgresql/extension/*",
]

[build-system]
requires = ["setuptools>=58.0.0", "wheel"]
build-backend = "setuptools.build_meta"
