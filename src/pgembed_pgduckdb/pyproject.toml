[project]
name = "pgembed-pgduckdb"
version = "0.3.0rc1"
description = "pg_duckdb extension for pgembed"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pgembed>=0.3.0rc1,<0.4"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=58.0.0", "wheel"]
build-backend = "setuptools.build_meta"
