name: Build and Test

on:
  push:
    branches: [testing, main]
  release:
    types: [created]
  workflow_dispatch:

env:
  PG_BUILD_CACHE_EPOCH: pg18-bundle-v1
  RUST_TOOLCHAIN: '1.95.0'
  CARGO_PGRX_VERSION: '0.17.0'

jobs:
  static_tests:
    name: Static and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest psutil fasteners platformdirs
      - name: Validate source, metadata, stamps, command wrappers, and release evidence
        run: |
          mkdir -p test-reports
          python -m py_compile src/pgembed/*.py tools/*.py
          PYTHONPATH=src pytest -q --junitxml=test-reports/static.xml \
            tests/test_bundle_metadata.py \
            tests/test_postgres_build.py \
            tests/test_pgdata_inspection.py \
            tests/test_commands.py \
            tests/test_standalone_extensions.py \
            tests/test_tigerfs_build.py \
            tests/test_wheel_dependency_audit.py \
            tests/test_release_evidence.py
      - name: Archive static test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-static
          path: test-reports/*.xml
          if-no-files-found: warn
          overwrite: true

  migration_boundary:
    name: PG17 to PG18 migration boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest psutil fasteners platformdirs
      - name: Prove incompatible or ambiguous PGDATA is untouched
        run: |
          mkdir -p test-reports
          PYTHONPATH=src pytest -q --junitxml=test-reports/migration-boundary.xml tests/test_pgdata_inspection.py
      - name: Archive migration boundary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-migration-boundary
          path: test-reports/*.xml
          if-no-files-found: warn
          overwrite: true

  build_wheels:
    name: Build wheels on ${{ matrix.os }}-${{ matrix.arch }}
    needs: [static_tests, migration_boundary]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: macos-latest
            arch: arm64
            deployment-target: '26.0' # minos 26.0. This does not claim compatibility with older macOS.
            extensions: pgvector vectorchord age psql_bm25s timescaledb pg_cron pg_net pgsql_http plsh tigerfs
          - runner: ubuntu-latest
            os: ubuntu-latest
            arch: x86_64
            deployment-target: ''
            extensions: pgvector vectorchord age psql_bm25s timescaledb pg_cron pg_net pgsql_http plsh tigerfs
          - runner: ubuntu-24.04-arm
            os: ubuntu-latest
            arch: aarch64
            deployment-target: ''
            extensions: pgvector vectorchord age psql_bm25s timescaledb pg_cron pg_net pgsql_http plsh tigerfs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce clean native state for tags and releases
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          for path in (Path('pgbuild'), Path('src/pgembed/pginstall')):
              if path.name == 'pgbuild':
                  for child in path.iterdir():
                      if child.name != 'Makefile':
                          shutil.rmtree(child, ignore_errors=True) if child.is_dir() else child.unlink(missing_ok=True)
              else:
                  shutil.rmtree(path, ignore_errors=True)
          PY
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cibuildwheel
      - name: Restore PostgreSQL 18 native cache (macOS only)
        if: ${{ matrix.os != 'ubuntu-latest' && github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') }}
        id: restore-postgres
        uses: actions/cache/restore@v4
        with:
          path: |
            pgbuild
            src/pgembed/pginstall
          key: ${{ env.PG_BUILD_CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'pgbuild/Makefile', 'tools/generate_bundle_metadata.py', '.github/workflows/build-and-test.yml') }}
      - name: Install Rust
        if: matrix.os != 'ubuntu-latest'
        run: |
          rustup install "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"
      - name: Install build tools (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ccache jq openssl cmake ninja icu4c@78 curl bison
      - name: Assert system GNU Make 3.81 (macOS)
        if: matrix.os == 'macos-latest'
        run: make --version | grep -q '^GNU Make 3\.81$'
      - name: Build native PostgreSQL 18 payload (macOS)
        if: ${{ matrix.os != 'ubuntu-latest' && steps.restore-postgres.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
          EXTENSIONS: ${{ matrix.extensions }}
        run: |
          export PATH="$(pwd)/src/pgembed/pginstall/bin:$HOME/.cargo/bin:/opt/homebrew/opt/ccache/bin:$PATH"
          # no LDFLAGS: see CIBW_ENVIRONMENT_MACOS — nothing in the bundle may
          # link Homebrew OpenSSL or the wheel dependency audit rejects it
          export IS_MUSL=0
          cargo install cargo-pgrx --version "$CARGO_PGRX_VERSION" --locked
          make EXTENSIONS="$EXTENSIONS" build
      - name: Save PostgreSQL 18 native cache (macOS)
        if: ${{ matrix.os != 'ubuntu-latest' && steps.restore-postgres.outputs.cache-hit != 'true' && github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/save@v4
        with:
          path: |
            pgbuild
            src/pgembed/pginstall
          key: ${{ env.PG_BUILD_CACHE_EPOCH }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'pgbuild/Makefile', 'tools/generate_bundle_metadata.py', '.github/workflows/build-and-test.yml') }}
      - name: Build CPython 3.12-3.14 wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: cp312-* cp313-* cp314-*
          # cp3XX-* would also match musllinux containers, whose before_all
          # environment has neither yum nor apt; musl builds are unsupported
          # (vectorchord is skipped there) and not part of the release.
          CIBW_SKIP: '*-musllinux_*'
          # cibuildwheel 4.x has no top-level CIBW_MANYLINUX option (it was
          # silently ignored and builds fell back to the 2_28 default); the
          # per-architecture image variables are the supported way to pick
          # the baseline. Stay on manylinux_2_28: the 2_34 image's toolchain
          # defaults to the x86-64-v2 ISA, which auditwheel's policy rejects
          # ("depends on unsupported ISA extensions"), and 2_39 exists only
          # for aarch64/riscv64 anyway.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_MACOS: |
            brew install jq llvm cmake ninja openssl icu4c@78 curl bison
            export IS_MUSL=0
            rustup install 1.95.0
            rustup default 1.95.0
            cargo install cargo-pgrx --version 0.17.0 --locked
            make EXTENSIONS="${{ matrix.extensions }}" build
          CIBW_BEFORE_ALL_LINUX: |
            set -e
            if command -v yum &> /dev/null; then
              # full perl: the minimal perl in the manylinux_2_34 image lacks
              # FindBin.pm, which postgres's genbki.pl/gen_node_support.pl need
              yum install -y ccache jq gcc perl openssl-devel zlib-devel libxml2-devel llvm-devel clang-devel pkg-config cmake ninja-build libcurl-devel libicu-devel glib2-devel flex bison
            elif command -v apt-get &> /dev/null; then
              apt-get update
              apt-get install -y ccache jq gcc perl libssl-dev zlib1g-dev libxml2-dev llvm-dev clang-dev pkg-config cmake ninja-build libcurl4-openssl-dev libicu-dev libglib2.0-dev flex bison
            fi
            # pg_net >= 0.20 needs the libcurl 7.83+ API; distro libcurls are
            # older, so build a private curl. auditwheel vendors the resulting
            # libcurl.so.4 into the wheel (not in the manylinux whitelist).
            bash /project/tools/build_curl.sh /usr/local/curl-pg
            # openssl-sys (cargo-pgrx dependency) no longer accepts the 1.1.1
            # in this image; point it at the OpenSSL 3 built above.
            export OPENSSL_DIR=/usr/local/curl-pg/openssl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
            export PATH="$HOME/.cargo/bin:/usr/lib/ccache:$PATH"
            rustup default 1.95.0
            cargo install cargo-pgrx --version 0.17.0 --locked
            export IS_MUSL=0
            # no RUSTFLAGS target-features: AVX2/FMA produce an x86-64-v3
            # binary that auditwheel's manylinux policy rejects
            make EXTENSIONS="${{ matrix.extensions }}" build
          CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.cargo/bin:$PATH:/project/src/pgembed/pginstall/bin" EXTENSIONS="${{ matrix.extensions }}" RUSTUP_TOOLCHAIN=1.95.0 OPENSSL_DIR=/usr/local/curl-pg/openssl PG_NET_CURL_PREFIX=/usr/local/curl-pg PGSQL_HTTP_CURL_CONFIG=/usr/local/curl-pg/bin/curl-config
          CIBW_ENVIRONMENT_MANYLINUX: LIBCLANG_PATH=/usr/lib64
          # No LDFLAGS: "-lssl -lcrypto" here linked Homebrew OpenSSL into the
          # postgres binary, delocate vendored it into the wheel, and the
          # dependency audit then rejected its absolute install name. Nothing
          # in the bundle needs OpenSSL on macOS (pg_net/pgsql-http use the
          # system libcurl, which carries its own TLS).
          CIBW_ENVIRONMENT_MACOS: PATH="$PWD/src/pgembed/pginstall/bin:$HOME/.cargo/bin:/opt/homebrew/opt/ccache/bin:$PATH" MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment-target }} EXTENSIONS="${{ matrix.extensions }}" RUSTUP_TOOLCHAIN=1.95.0 BINDGEN_EXTRA_CLANG_ARGS="$(pg_config --cppflags) -I$(xcrun --show-sdk-path)/usr/include -I/opt/homebrew/include"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        run: python -m cibuildwheel --output-dir wheelhouse
      - name: Audit repaired wheel native dependencies
        run: python tools/audit_wheel_dependencies.py wheelhouse/*.whl
      - name: Generate wheel hashes and source lock evidence
        run: |
          python tools/extract_wheel_attestation.py wheelhouse
          python tools/release_evidence.py generate \
            --metadata wheelhouse/build-metadata.json \
            --wheel-dir wheelhouse \
            --output-dir release-evidence
      - name: Archive wheel payloads
        uses: actions/upload-artifact@v4
        with:
          path: wheelhouse/*.whl
          name: python-package-distributions-${{ matrix.os }}-${{ matrix.arch }}
          overwrite: true
      - name: Archive bundle attestation
        uses: actions/upload-artifact@v4
        with:
          path: |
            wheelhouse/build-metadata.json
            wheelhouse/postgres-bundle-config.stamp
            release-evidence/wheel-sha256s.txt
            release-evidence/source-locks.json
          name: pg18-bundle-attestation-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true

  runtime_integration:
    name: Runtime integration on ${{ matrix.os }}-${{ matrix.arch }}
    needs: build_wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: macos-latest
            arch: arm64
          - runner: ubuntu-latest
            os: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: ubuntu-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-${{ matrix.os }}-${{ matrix.arch }}
          path: dist
      - name: Install wheel and runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(find dist -name '*cp312*.whl' | head -n 1)" pytest psycopg2-binary sqlalchemy sqlalchemy-utils
      - name: Installed-wheel smoke
        run: |
          mkdir -p test-reports
          pytest -q --junitxml=test-reports/installed-wheel-smoke.xml tests/test_bundled_tools.py
      - name: PostgreSQL 18 native integration
        run: pytest -q --junitxml=test-reports/native-integration.xml -m integration tests/test_pgembed.py tests/test_tigerfs_pg18.py
      - name: Archive runtime test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-runtime-${{ matrix.os }}-${{ matrix.arch }}
          path: test-reports/*.xml
          if-no-files-found: warn
          overwrite: true

  tigerfs_mount_macos:
    name: TigerFS mount gate (macOS arm64)
    needs: build_wheels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-macos-latest-arm64
          path: dist
      - run: python -m pip install "$(find dist -name '*cp312*.whl' | head -n 1)" pytest
      - name: Mount and unmount TigerFS against PostgreSQL 18
        run: |
          mkdir -p test-reports
          pytest -q --junitxml=test-reports/tigerfs-mount.xml -m tigerfs_mount tests/test_tigerfs_pg18.py
      - name: Archive TigerFS mount report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-tigerfs-mount-macos-arm64
          path: test-reports/*.xml
          if-no-files-found: warn
          overwrite: true
      # Linux mount coverage belongs on a dedicated runner exposing /dev/fuse;
      # ordinary hosted/manylinux containers intentionally run only binary smoke.

  publish-to-pypi:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: Publish PostgreSQL 18 pre-release to PyPI
    needs: [static_tests, migration_boundary, build_wheels, runtime_integration, tigerfs_mount_macos]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pgembed
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Require an alpha, beta, or release-candidate tag
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '(a|b|rc)[0-9]+$' || {
            echo "The first PostgreSQL 18 release must use a pre-release tag (a, b, or rc)." >&2
            exit 1
          }
      - uses: actions/download-artifact@v4
        with:
          pattern: python-package-distributions-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: pg18-bundle-attestation-*
          path: evidence
      - name: Verify every publishable wheel against archived build evidence
        run: python tools/release_evidence.py verify --wheel-dir dist --evidence-dir evidence
      - uses: pypa/gh-action-pypi-publish@release/v1
