[project]
name = "pgembed-examples"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pgembed>=0.1.7",
    # sqlalchemy-utils (0.42.x) does not support SQLAlchemy 2.1's private
    # rename of ScalarAttributeImpl yet; cap until it does.
    "sqlalchemy>=2.0.0,<2.1",
    "sqlalchemy-utils>=0.42.0",
    "psycopg2-binary>=2.9.11",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
